needs_types_base_options:
  mandatory_options:
    version: "^[0-9]+$"
  optional_options:
    shared: "^shared$"

prohibited_words_checks:
  title_check:
    title:
      - shall
      - must

needs_types:
  sample:
    title: Sample
    prefix: sample__
    tags:
      - requirement
    parts: 2
    mandatory_options:
      own: "^own$"
    optional_options:
      shared: "^override$"
    mandatory_links:
      required_link: first, second
    optional_links:
      any_link: ANY

needs_extra_links:
  any_link:
    incoming: incoming any
    outgoing: outgoing any
  required_link:
    incoming: incoming required
    outgoing: outgoing required

graph_checks:
  nested_rule:
    needs:
      include: sample
      condition:
        and:
          - status == valid
          - or:
              - safety == QM
              - safety == ASIL_B
    check:
      required_link:
        or:
          - status == valid
          - status == draft
    explanation: Nested conditions remain raw data.
