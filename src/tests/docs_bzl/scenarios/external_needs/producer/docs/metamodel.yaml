needs_types:
  test_req:
    title: Test Requirement
    prefix: test_req__
    parts: 3
    mandatory_options:
      id: ^test_req__[0-9a-zA-Z_]*$
      status: ^(draft|valid)$
    optional_options:
      # These are all sphinx-needs default fields. Listing them keeps the
      # metamodel/default option overlap exactly at the set score_metamodel
      # treats as intentional ({id, tags, status, content, template}), which
      # avoids a setup-time warning that -W would turn into a build error.
      tags: .*
      content: .*
      template: .*
links: {}
