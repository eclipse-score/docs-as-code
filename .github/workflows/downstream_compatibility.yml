name: Downstream Compatibility
on:
  workflow_call:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: [
          "baselibs and remote",
          "inc_security_crypto and remote",
          "inc_someip_gateway and remote",
          "infrastructure and remote",
          "itf and remote",
          "kyron and remote",
          "lifecycle and remote",
          "logging and remote",
          "module_template and local",
          "module_template and remote",
          "persistency and remote",
          "process_description and local",
          "process_description and remote",
          "score and local",
          "score and remote",
          "time and remote",
        ]

    steps:
      - name: 🛡️ Harden Runner
        if: github.repository_owner == 'eclipse-score'
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false

      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Prepare Python
        run: bazel run //:ide_support

      - name: Run Consumer tests
        run: .venv_docs/bin/python -m pytest -vv -s src/tests/downstream_compatibility -k "$CONSUMER"
        env:
          FORCE_COLOR: "1"
          TERM: xterm-256color
          PYTHONUNBUFFERED: "1"
          CONSUMER: ${{ matrix.consumer }}
