name: Run Bazel Tests
on:
  workflow_call:
jobs:
  docs_bzl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cached
            marker: bazel_cached
          - suite: runtime
            marker: bazel_slow

    steps:
      - name: 🛡️ Harden Runner
        if: github.repository_owner == 'eclipse-score'
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false

      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@cache
        with:
          # Each matrix entry needs its own disk cache because the jobs run in
          # parallel and GitHub Actions cannot merge concurrent cache writers.
          disk-cache-key: ${{ github.job }}-${{ matrix.suite }}

      - name: Setup venv
        run: bazel run --lockfile_mode=error //:ide_support

      - name: Prepare test report directory
        run: mkdir -p tests-report

      - name: Run docs.bzl tests
        run: >-
          .venv_docs/bin/python -m pytest -vv
          -m "${{ matrix.marker }}"
          src/tests/docs_bzl
          --junitxml=tests-report/docs_bzl_${{ matrix.suite }}.xml

      - name: Upload docs.bzl test report
        # No need to upload something that doesn't exist.
        # This would be skipped anyway if the step before isn't running
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-report-docs-bzl-${{ matrix.suite }}
          path: tests-report

  bazel_tests:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden Runner
        if: github.repository_owner == 'eclipse-score'
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false

      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@cache
        with:
          disk-cache-key: ${{ github.job }}

      - name: Run bazel test targets
        run: bazel test --lockfile_mode=error //... --build_tests_only

      - name: Build all targets
        # Skip tests, since some are non buildable negative tests.
        run: bazel build --lockfile_mode=error //... -- -//src/tests/...

      - name: Prepare bundled test report
        if: ${{ !cancelled() }}
        # Follow Symlinks via '-L' to copy correctly.
        run: mkdir -p tests-report && rsync -amL --include='*/' --include='test.xml' --include='test.log' --exclude='*' bazel-testlogs/ tests-report/

      - name: Upload Bazel test report
        # No need to upload something that doesn't exist.
        # This would be skipped anyway if the step before isn't running.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-report-bazel
          path: tests-report

  merge_test_reports:
    if: ${{ always() && needs.docs_bzl.result == 'success' && needs.bazel_tests.result == 'success' }}
    needs: [docs_bzl, bazel_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download test reports
        uses: actions/download-artifact@v8
        with:
          pattern: tests-report-*
          path: tests-report
          merge-multiple: true

      - name: Upload merged test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-report
          path: tests-report
