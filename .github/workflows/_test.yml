name: Run Bazel Tests
on:
  workflow_call:
jobs:
  docs_bzl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ["cached", "runtime"]
        python-version: ["3.12", "3.14"]
        include:
          - suite: cached
            marker: bazel_cached
          - suite: runtime
            marker: bazel_slow
          # Which lines run does not depend on the Python version, and measuring
          # slows the job down: one version is enough.
          - python-version: "3.12"
            coverage: true

    steps:
      - name: 🛡️ Harden Runner
        if: github.repository_owner == 'eclipse-score'
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false

      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@cache
        with:
          # Each matrix entry needs its own disk cache because the jobs run in
          # parallel and GitHub Actions cannot merge concurrent cache writers.
          disk-cache-key: ${{ github.job }}-${{ matrix.python-version }}-${{ matrix.suite }}

      - name: Setup venv
        run: >-
          bazel run --lockfile_mode=error
          --@rules_python//python/config_settings:python_version=${{ matrix.python-version }}
          //:ide_support

      - name: Prepare test report directory
        run: mkdir -p tests-report

      - name: Run docs.bzl tests
        env:
          # In the workspace, not /tmp: each Bazel sandbox gets a private /tmp.
          # See src/tests/docs_bzl/README.md.
          DOCS_BZL_COVERAGE_DIR: ${{ matrix.coverage && format('{0}/.coverage_docs_bzl', github.workspace) || '' }}
        run: >-
          .venv_docs/bin/python -m pytest -vv
          -m "${{ matrix.marker }}"
          src/tests/docs_bzl
          --junitxml=tests-report/docs_bzl_${{ matrix.python-version }}_${{ matrix.suite }}.xml

      - name: Upload docs.bzl coverage data
        if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-docs-bzl-${{ matrix.suite }}
          path: .coverage_docs_bzl
          # upload-artifact skips dot files by default, and coverage.py names
          # its data files .coverage.*
          include-hidden-files: true

      - name: Upload docs.bzl test report
        # No need to upload something that doesn't exist.
        # This would be skipped anyway if the step before isn't running
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-report-docs-bzl-${{ matrix.python-version }}-${{ matrix.suite }}
          path: tests-report

  bazel_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        include:
          # Which lines run does not depend on the Python version, and measuring
          # slows the job down: one version is enough.
          - python-version: "3.12"
            coverage: true
    steps:
      - name: 🛡️ Harden Runner
        if: github.repository_owner == 'eclipse-score'
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false

      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@cache
        with:
          disk-cache-key: ${{ github.job }}-${{ matrix.python-version }}

      - name: Run bazel test targets
        # `bazel coverage` runs the same tests, so measuring needs no second test run.
        run: >-
          bazel ${{ matrix.coverage && 'coverage --combined_report=lcov' || 'test' }}
          --lockfile_mode=error
          --@rules_python//python/config_settings:python_version=${{ matrix.python-version }}
          //... --build_tests_only

      - name: Collect unit test coverage
        if: ${{ matrix.coverage && !cancelled() }}
        # bazel-out is a symlink into Bazel's output base; copy the report out.
        run: >-
          mkdir -p coverage-data &&
          cp -L bazel-out/_coverage/_coverage_report.dat coverage-data/unit_tests.lcov

      - name: Upload unit test coverage
        if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-unit-tests
          path: coverage-data/unit_tests.lcov

      - name: Build all targets
        # Skip tests, since some are non buildable negative tests.
        run: >-
          bazel build --lockfile_mode=error
          --@rules_python//python/config_settings:python_version=${{ matrix.python-version }}
          //... -- -//src/tests/...

      - name: Prepare bundled test report
        if: ${{ !cancelled() }}
        # Follow Symlinks via '-L' to copy correctly.
        run: mkdir -p tests-report && rsync -amL --include='*/' --include='test.xml' --include='test.log' --exclude='*' bazel-testlogs/ tests-report/

      - name: Upload Bazel test report
        # No need to upload something that doesn't exist.
        # This would be skipped anyway if the step before isn't running.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-report-bazel-${{ matrix.python-version }}
          path: tests-report

  merge_test_reports:
    if: ${{ !cancelled() }}
    needs: [docs_bzl, bazel_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download test reports
        uses: actions/download-artifact@v8
        with:
          pattern: tests-report-*
          path: tests-report
          merge-multiple: true

      - name: Upload merged test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-report
          path: tests-report

  coverage_report:
    # Merged here rather than per job so the PR gets one combined number.
    # coverage_comment.yml posts it: this workflow's token is read-only for
    # pull requests from forks. Also runs after failed tests, because the
    # coverage of the tests that did run is still useful.
    if: ${{ !cancelled() }}
    needs: [docs_bzl, bazel_tests]
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden Runner
        if: github.repository_owner == 'eclipse-score'
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bazel with shared caching
        uses: eclipse-score/cicd-actions/setup-bazel-cache@cache
        with:
          disk-cache-key: ${{ github.job }}

      # Download by pattern, not name: when a test job uploaded nothing, the
      # report shows "no data" for it instead of this job failing.
      - name: Download unit test coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-unit-tests
          path: coverage-data/unit_tests
          merge-multiple: true

      - name: Download docs.bzl coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-docs-bzl-*
          path: coverage-data/docs_bzl
          merge-multiple: true

      - name: Merge coverage
        run: >-
          bazel run --lockfile_mode=error //tools:coverage_report --
          "Unit tests=coverage-data/unit_tests/unit_tests.lcov"
          "docs.bzl scenarios=coverage-data/docs_bzl"
          --output coverage-data/coverage.lcov
          --markdown coverage-data/summary.md

      # Pushes to main and merge queue runs get no PR comment; this makes their
      # coverage visible on the run page.
      - name: Show coverage summary
        run: cat coverage-data/summary.md >> "$GITHUB_STEP_SUMMARY"

      # coverage_comment.yml cannot take the number from its workflow_run
      # event: that list of pull requests is empty for forks.
      - name: Store pull request number for the coverage comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > coverage-data/pr_number

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage-data/coverage.lcov
            coverage-data/summary.md
            coverage-data/pr_number
