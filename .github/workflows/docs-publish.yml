name: Publish Documentation

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

jobs:
  docs-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@e5295061011ca186d3397e187764c73feed4b67c # main 08/10/2026
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: write
