name: Publish Documentation

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

jobs:
  docs-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@7c5c10c1f3f631fd26b8f9b00d5b147b1b9cff00
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: write
