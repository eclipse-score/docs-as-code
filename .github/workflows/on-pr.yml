name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  common:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@88cb460c47cb49efeb25cd7b73c8945dd1c5bce2 # on-pr/v0.0.0
    permissions:
      contents: read

  tests:
    uses: ./.github/workflows/_test.yml

  docs-build:
    needs: [tests]
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@7b1b65cbb59d5f817e639a731f018db5adb3028a
    with:
      bazel-target: "//:docs"
      tests-report-artifact: tests-report
