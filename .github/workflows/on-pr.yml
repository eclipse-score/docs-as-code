name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  common:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@cache

  tests:
    uses: ./.github/workflows/_test.yml
    permissions:
      contents: read
      actions: write # cleanup old caches

  docs-build:
    needs: [tests]
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@a94fd56474c89168317addc877c91624829049f3 # main (2026-11-11)
    with:
      bazel-target: "//:docs"
      # Bazel reports overlap across Python versions, so select one version.
      # The docs.bzl filenames include the Python version and suite.
      tests-report-artifacts: |
        tests-report-bazel-3.12
        tests-report-docs-bzl-*
