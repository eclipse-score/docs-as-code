[project]
name = "score-docs-delta"
version = "0.1.0"
description = "Compare rendered S-CORE documentation builds"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
docs-delta = "docs_delta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "__init__.py",
  "__main__.py",
  "cli.py",
  "comparison.py",
  "github.py",
  "rendered_html.py",
  "report.py",
]
sources = { "" = "docs_delta" }
dev-mode-dirs = [".."]
